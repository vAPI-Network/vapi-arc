name: Deploy Arc Demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-arc-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Deployment preflight
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    outputs:
      deploy-ref: ${{ steps.ref.outputs.deploy-ref }}
    steps:
      - name: Select tested revision
        id: ref
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "deploy-ref=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying tested revision: $TESTED_SHA"

      - name: Validate deployment configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          set -euo pipefail

          for name in \
            RAILWAY_TOKEN \
            RAILWAY_PROJECT_ID \
            RAILWAY_WEB_SERVICE_ID \
            WEB_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::GitHub production configuration is missing ${name}"
              exit 1
            fi
          done

          uuid_pattern='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          for name in RAILWAY_PROJECT_ID RAILWAY_WEB_SERVICE_ID; do
            if [[ ! "${!name}" =~ $uuid_pattern ]]; then
              echo "::error::${name} must be a Railway service UUID"
              exit 1
            fi
          done

          if [[ ! "$WEB_URL" =~ ^https:// ]]; then
            echo "::error::WEB_URL must use HTTPS"
            exit 1
          fi

  deploy-web:
    name: Deploy app
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.preflight.outputs.deploy-ref }}
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.30.1

      - uses: ./.github/actions/railway-deploy
        with:
          project-id: ${{ vars.RAILWAY_PROJECT_ID }}
          service-id: ${{ vars.RAILWAY_WEB_SERVICE_ID }}
          environment: production
          service-name: vapi-web
          health-url: ${{ vars.WEB_URL }}/health
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  smoke:
    name: Verify live app
    needs: [preflight, deploy-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check marketplace, health, and assets
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "${WEB_URL}/health" >/dev/null

          home_html="$(curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "${WEB_URL}/")"
          if [[ "$home_html" != *"Work marketplace"* ]]; then
            echo "::error::Marketplace page did not render"
            exit 1
          fi

          if [[ "$home_html" =~ (/assets/root-[A-Za-z0-9_-]+\.css) ]]; then
            css_path="${BASH_REMATCH[1]}"
          else
            echo "::error::Home HTML did not reference compiled CSS"
            exit 1
          fi
          if [[ "$home_html" =~ (/assets/entry\.client-[A-Za-z0-9_-]+\.js) ]]; then
            js_path="${BASH_REMATCH[1]}"
          else
            echo "::error::Home HTML did not reference compiled JavaScript"
            exit 1
          fi
          for asset_path in "$css_path" "$js_path"; do
            curl --fail --silent --show-error \
              --retry 8 --retry-delay 3 --retry-all-errors \
              "${WEB_URL}${asset_path}" >/dev/null
          done

          for route in /arbiters /reputation; do
            curl --fail --silent --show-error \
              --retry 4 --retry-delay 3 --retry-all-errors \
              "${WEB_URL}${route}" >/dev/null
          done

  summary:
    name: Deployment summary
    if: always() && needs.preflight.result != 'skipped'
    needs: [preflight, deploy-web, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Summarize
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          {
            echo "## vAPI Work + Verify deployment"
            echo "- Preflight: ${PREFLIGHT_RESULT}"
            echo "- App: ${WEB_RESULT} — ${WEB_URL}"
            echo "- Smoke: ${SMOKE_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PREFLIGHT_RESULT" != "success" ||
                "$WEB_RESULT" != "success" ||
                "$SMOKE_RESULT" != "success" ]]; then
            exit 1
          fi
